services:
  postgres:
    image: postgres:16-alpine
    container_name: promarket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: promarket
      POSTGRES_PASSWORD: promarket
      POSTGRES_DB: promarket
    ports:
      - "5433:5432"
    volumes:
      - promarket_pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promarket"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: promarket-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://promarket:promarket@postgres:5432/promarket_py
      DATABASE_URL_SYNC: postgresql://promarket:promarket@postgres:5432/promarket_py
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: promarket-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    environment:
      DATABASE_URL: postgresql://promarket:promarket@postgres:5432/promarket?schema=public
      DIRECT_URL: postgresql://promarket:promarket@postgres:5432/promarket?schema=public
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  promarket_pgdata:
  backend_venv:
  frontend_node_modules:
  frontend_next:
